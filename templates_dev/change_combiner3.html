<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cours des Billets - TV VIEDER Elite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts : Playfair Display pour l'esthétique luxe des en-têtes, Fira Code pour l'alignement parfait des chiffres, Plus Jakarta Sans pour le texte -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #07080b;
            overflow: hidden;
        }
        .font-serif-luxury {
            font-family: 'Playfair Display', serif;
        }
        .font-mono-numbers {
            font-family: 'Fira Code', monospace;
        }
        /* Ligne de division verticale : Vert Émeraude Impérial biseauté avec ombre diffuse */
        .emerald-vertical-line {
            background: linear-gradient(180deg, #0d9488 0%, #115e59 50%, #0d9488 100%) !important;
            box-shadow: 0 0 10px rgba(13, 148, 136, 0.4);
            width: 4px;
            position: relative;
        }
        /* Découpe héraldique en écusson pour les drapeaux */
        .shield-flag {
            clip-path: polygon(0% 0%, 100% 0%, 100% 75%, 50% 100%, 0% 75%);
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
            transition: transform 0.3s ease;
        }
        /* Rendu ardoise/marbre pour les lignes du tableau */
        .luxury-row {
            background-color: #0c0e15;
            border-bottom: 1px solid rgba(197, 168, 128, 0.05);
        }
        .luxury-row:nth-child(even) {
            background-color: #0e111a;
        }
        /* Ambiance feutrée de fond */
        .luxury-bg-pattern {
            background-image: radial-gradient(rgba(197, 168, 128, 0.02) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="text-[#e2e8f0] min-h-screen flex flex-col justify-center items-center antialiased p-2 sm:p-4 relative select-none luxury-bg-pattern">

    <!-- Container d'affichage TV principal -->
    <main class="w-full max-w-xl bg-[#090a0d] shadow-[0_30px_70px_rgba(0,0,0,0.95)] rounded-2xl overflow-hidden border border-[#c5a880]/15 flex flex-col relative z-10">
        
        <!-- EN-TÊTE TV : Réplique d'un écran de prestige -->
        <header class="relative h-[165px] overflow-hidden flex items-center px-6 bg-gradient-to-b from-[#121520] to-[#090a0d] border-b border-[#c5a880]/10">
            
            <div class="relative w-full z-10 flex items-center justify-between">
                
                <!-- LOGO "TV VIEDER" : Métallique Or Champagne (Bouton secret d'administration) -->
                <div id="btn-edit-rates" title="Administration des cours" class="cursor-pointer group w-[125px] h-[105px] bg-gradient-to-br from-[#1c1a17] via-[#0f0e0d] to-[#050404] border border-[#c5a880]/20 rounded-lg shadow-[0_8px_25px_rgba(0,0,0,0.75),inset_0_1px_1px_rgba(255,255,255,0.05)] flex items-center justify-center p-3 hover:border-[#c5a880]/50 transition-all duration-300">
                    <svg viewBox="0 0 100 80" class="w-full h-full transform group-hover:scale-[1.03] transition-transform duration-300" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Gradient Or Poli -->
                            <linearGradient id="gold-brushed-v3" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#f3e7d3"/>
                                <stop offset="35%" stop-color="#d4af37"/>
                                <stop offset="70%" stop-color="#aa7c11"/>
                                <stop offset="100%" stop-color="#805a00"/>
                            </linearGradient>
                            <filter id="subtle-shadow-v3">
                                <feDropShadow dx="0.5" dy="1" stdDeviation="0.5" flood-color="#000" flood-opacity="0.9"/>
                            </filter>
                        </defs>
                        <g filter="url(#subtle-shadow-v3)">
                            <!-- Lettres T & V gravées à gauche -->
                            <text x="3" y="31" font-family="'Playfair Display', serif" font-weight="800" font-size="26" fill="url(#gold-brushed-v3)" letter-spacing="-1">T</text>
                            <text x="5" y="63" font-family="'Playfair Display', serif" font-weight="800" font-size="26" fill="url(#gold-brushed-v3)" letter-spacing="-1">V</text>
                            
                            <!-- Laser biseauté d'or -->
                            <line x1="28" y1="8" x2="28" y2="72" stroke="url(#gold-brushed-v3)" stroke-width="1.5" opacity="0.8" />
                            
                            <!-- Écriture VIEDER à droite -->
                            <text x="36" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="url(#gold-brushed-v3)">V</text>
                            <text x="36" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="url(#gold-brushed-v3)">I</text>
                            <text x="36" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="url(#gold-brushed-v3)">E</text>
                            <text x="36" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="url(#gold-brushed-v3)">D</text>
                            <text x="36" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="url(#gold-brushed-v3)">E</text>
                            <text x="36" y="71" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="url(#gold-brushed-v3)">R</text>
                        </g>
                    </svg>
                </div>

                <!-- BLOCS DE TEXTES : Typographie Éditoriale Raffinée -->
                <div class="flex-1 text-center pr-2 flex flex-col justify-center">
                    <h1 class="font-serif-luxury text-[24px] font-bold tracking-normal text-white leading-none">
                        Cours des Billets
                    </h1>
                    <div class="h-[1px] w-1/4 bg-gradient-to-r from-transparent via-[#c5a880]/35 to-transparent mx-auto my-2.5"></div>
                    <h2 class="text-[12px] font-extrabold tracking-[0.25em] text-[#c5a880] uppercase leading-none opacity-90">
                        Référence Banque Al-Maghrib
                    </h2>
                    <span id="header-date" class="font-serif-luxury italic text-[14px] text-slate-400 mt-2.5 block">
                        du 19 Mai 2026
                    </span>
                </div>

            </div>
        </header>

        <!-- TABLEAU DES COURS AVEC DOUBLE EN-TÊTE ET PROLONGEMENT DE DIVISION -->
        <section class="flex-grow bg-[#090a0d]">
            <table class="w-full text-left border-collapse table-fixed">
                <colgroup>
                    <col class="w-[9%]">   <!-- Unité -->
                    <col class="w-[31%]">  <!-- Devises -->
                    <col class="w-[15%]">  <!-- Achat -->
                    <col class="w-[15%]">  <!-- Vente -->
                    <col class="w-[4px]">   <!-- Ligne de séparation émeraude -->
                    <col class="w-[15%]">  <!-- Ref BKAM -->
                    <col class="w-[15%]">  <!-- TPE -->
                </colgroup>

                <!-- Double En-tête -->
                <thead class="sticky top-0 z-20 text-[10px] font-bold uppercase tracking-wider">
                    
                    <!-- LIGNE 1 : Catégories divisées par le rayon vert vertical -->
                    <tr class="bg-[#121520] border-b border-slate-900">
                        <!-- Côté Gauche : TAUX DE CHANGE -->
                        <td colspan="4" class="py-3 px-3 text-center">
                            <span class="text-[11.5px] font-semibold tracking-[0.15em] text-[#dfc49f] font-serif-luxury italic">
                                Taux de Change Cash
                            </span>
                        </td>
                        <!-- Jonction de la ligne verte de division -->
                        <td class="emerald-vertical-line p-0 relative">
                            <div class="absolute inset-0 emerald-vertical-line"></div>
                        </td>
                        <!-- Côté Droit : ACHAT PAR CARTE - TPE -->
                        <td colspan="2" class="py-3 px-2 text-center bg-[#07241e]/50">
                            <span class="inline-flex items-center gap-1.5 text-[10px] font-semibold tracking-[0.12em] text-[#34d399] font-serif-luxury italic">
                                Achat par Carte (TPE)
                            </span>
                        </td>
                    </tr>

                    <!-- LIGNE 2 : En-têtes secondaires -->
                    <tr class="bg-[#090a0d] border-b border-slate-800 text-slate-400">
                        <th class="py-3 px-1 text-center font-bold tracking-wider">Unité</th>
                        <th class="py-3 px-2 text-left font-bold tracking-wider">Devises</th>
                        <th class="py-3 px-1 text-center text-rose-400/80 font-bold">Achat</th>
                        <th class="py-3 px-1 text-center text-sky-400/80 font-bold">Vente</th>
                        <!-- Ligne verticale -->
                        <th class="emerald-vertical-line p-0 relative">
                            <div class="absolute inset-0 emerald-vertical-line"></div>
                        </th>
                        <th class="py-3 px-1 text-center text-emerald-400/80 font-bold">Ref BKAM</th>
                        <th class="py-3 px-1 text-center text-amber-500/80 font-bold">Tpe (-5%)</th>
                    </tr>
                </thead>

                <!-- Corps du tableau : Généré de manière stable -->
                <tbody id="rates-table-body">
                    <!-- Les rangées sont générées de manière dynamique par JS -->
                </tbody>
            </table>
        </section>

        <!-- MODAL D'ÉDITION DES TAUX (Dissimulé, accessible via le logo secret) -->
        <div id="editor-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-[#0f111a] border border-[#c5a880]/20 w-full max-w-sm rounded-xl p-6 shadow-2xl max-h-[85vh] flex flex-col">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                    <h3 class="font-serif-luxury font-bold text-md text-[#dfc49f]">Éditeur de Cours</h3>
                    <button id="close-editor-modal" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
                </div>
                
                <div class="space-y-3 mb-4">
                    <label class="block text-xs text-slate-400 font-semibold">Date de Référence :</label>
                    <input type="text" id="edit-header-date" class="w-full bg-[#161a27] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-semibold focus:border-[#c5a880] focus:outline-none">
                </div>

                <div id="editor-form-container" class="space-y-4 overflow-y-auto pr-1 flex-grow">
                    <!-- Rempli par le script -->
                </div>

                <div class="border-t border-slate-800 pt-3 mt-4 flex gap-2">
                    <button id="btn-reset-rates" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-bold text-xs transition-colors">Réinitialiser</button>
                    <button id="btn-save-rates" class="flex-1 py-2 bg-emerald-700 hover:bg-emerald-600 text-white rounded-lg font-bold text-xs transition-colors">Enregistrer</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Script Javascript de gestion de l'affichage TV -->
    <script>
        const initialRatesData = [
            { id: "EUR", unite: 1, name: "Europe", buy: 10.44, sell: 11.08, bkam: 10.71, tpe: 10.18, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#003399"/><g fill="#ffcc00" transform="translate(256,256) scale(26)"><circle r="4" fill="none"/><g id="star"><path d="m0-1.2.3.9h1l-.8.6.3.9-.8-.6-.8.6.3-.9-.8-.6h1z"/></g><use href="#star" y="-7.5"/><use href="#star" y="7.5"/><use href="#star" x="-7.5"/><use href="#star" x="7.5"/><use href="#star" x="-5.3" y="-5.3"/><use href="#star" x="5.3" y="-5.3"/><use href="#star" x="-5.3" y="5.3"/><use href="#star" x="5.3" y="5.3"/><use href="#star" x="-7.2" y="-2.3"/><use href="#star" x="7.2" y="-2.3"/><use href="#star" x="-7.2" y="2.3"/><use href="#star" x="7.2" y="2.3"/></g></svg>` },
            { id: "USD", unite: 1, name: "Etats Unis", buy: 8.98, sell: 9.52, bkam: 9.21, tpe: 8.75, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#bb133e"/><path d="M0,39h512M0,118h512M0,196h512M0,275h512M0,354h512M0,433h512" stroke="#fff" stroke-width="39"/><rect width="205" height="275" fill="#002147"/><g fill="#fff"><g id="us-s5"><g id="us-s4"><g id="us-s3"><g id="us-s2"><g id="us-s1"><circle cx="17" cy="23" r="6"/></g><circle cx="51" cy="23" r="6"/></g><circle cx="85" cy="23" r="6"/></g><circle cx="119" cy="23" r="6"/></g><circle cx="153" cy="23" r="6"/></g><use href="#us-s5" y="46"/><use href="#us-s5" y="92"/><use href="#us-s5" y="138"/><use href="#us-s5" y="184"/><g id="us-s4-row" x="17" y="23"><use href="#us-s4" x="17" y="23"/><use href="#us-s4" x="17" y="69"/><use href="#us-s4" x="17" y="115"/><use href="#us-s4" x="17" y="161"/></g></g></svg>` },
            { id: "CAD", unite: 1, name: "Canada", buy: 6.53, sell: 6.93, bkam: 6.70, tpe: 6.36, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#ff0000"/><rect x="128" width="256" height="512" fill="#ffffff"/><path d="M256,120 L275,180 L335,160 L310,215 L360,240 L300,265 L315,330 L275,300 L256,380 L237,300 L197,330 L212,265 L152,240 L202,215 L177,160 L237,180 Z" fill="#ff0000"/></svg>` },
            { id: "GBP", unite: 1, name: "Angleterre", buy: 12.03, sell: 12.76, bkam: 12.31, tpe: 11.69, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#012169"/><path d="M0 0 L512 512 M0 512 L512 0" stroke="#fff" stroke-width="60"/><path d="M0 0 L512 512 M0 512 L512 0" stroke="#C8102E" stroke-width="40"/><path d="M256 0 V512 M0 256 H512" stroke="#fff" stroke-width="100"/><path d="M256 0 V512 M0 256 H512" stroke="#C8102E" stroke-width="60"/></svg>` },
            { id: "GIP", unite: 1, name: "Gibraltar", buy: 12.03, sell: 12.76, bkam: 12.31, tpe: 11.69, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#ffffff"/><rect y="341" width="512" height="171" fill="#da0012"/><g fill="#da0012" transform="translate(196, 120)"><rect x="30" y="60" width="60" height="120"/><rect x="150" y="20" width="60" height="160"/><rect x="230" y="60" width="60" height="120"/><rect x="30" y="160" width="260" height="20"/></g></svg>` },
            { id: "CHF", unite: 1, name: "Suisse", buy: 11.42, sell: 12.12, bkam: 11.72, tpe: 11.14, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#d52b1e"/><rect x="226" y="106" width="60" height="300" fill="#fff"/><rect x="106" y="226" width="300" height="60" fill="#fff"/></svg>` },
            { id: "SAR", unite: 1, name: "Arabie Saou...", buy: 2.39, sell: 2.54, bkam: 2.45, tpe: 2.33, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#0b6623"/><path d="M100,280 L412,280 M150,300 L362,300 M256,260 L256,320" stroke="#fff" stroke-width="8"/><path d="M150,350 L362,350" stroke="#fff" stroke-width="4"/></svg>` },
            { id: "KWD", unite: 1, name: "Koweit", buy: 29.04, sell: 30.81, bkam: 29.83, tpe: 28.34, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="170.6" fill="#128a41"/><rect y="170.6" width="512" height="170.6" fill="#fff"/><rect y="341.2" width="512" height="170.6" fill="#f31830"/><path d="M0 0 L150 170.6 L0 341.2 Z" fill="#000000"/></svg>` },
            { id: "AED", unite: 1, name: "Emirats Arab...", buy: 2.44, sell: 2.59, bkam: 2.51, tpe: 2.38, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="170.6" fill="#00732f"/><rect y="170.6" width="512" height="170.6" fill="#ffffff"/><rect y="341.2" width="512" height="170.6" fill="#000000"/><rect width="128" height="512" fill="#ff0000"/></svg>` },
            { id: "QAR", unite: 1, name: "Qatar", buy: 2.46, sell: 2.61, bkam: 2.53, tpe: 2.40, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#8a1538"/><path d="M0 0 H140 L190 28.4 L140 56.8 L190 85.2 L140 113.6 L190 142 L140 170.4 L190 198.8 L140 227.2 L190 255.6 L140 284 L190 312.4 L140 340.8 L190 369.2 L140 397.6 L190 426 L140 454.4 L190 482.8 L140 512 H0 Z" fill="#ffffff"/></svg>` },
            { id: "BHD", unite: 1, name: "Bahrein", buy: 23.81, sell: 25.26, bkam: 24.41, tpe: 23.19, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#da121a"/><path d="M0 0 H140 L190 51.2 L140 102.4 L190 153.6 L140 204.8 L190 256 L140 307.2 L190 358.4 L140 409.6 L190 460.8 L140 512 H0 Z" fill="#ffffff"/></svg>` },
            { id: "JPY", unite: 100, name: "Japon", buy: 5.64, sell: 5.99, bkam: 5.80, tpe: 5.51, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#ffffff"/><circle cx="256" cy="256" r="120" fill="#bc002d"/></svg>` }
        ];

        let rates = [...initialRatesData];

        const tableBody = document.getElementById('rates-table-body');
        const editorModal = document.getElementById('editor-modal');
        const headerDate = document.getElementById('header-date');
        const editHeaderDateInput = document.getElementById('edit-header-date');
        
        const btnEditRates = document.getElementById('btn-edit-rates');
        const editorFormContainer = document.getElementById('editor-form-container');
        const closeEditorModalBtn = document.getElementById('close-editor-modal');
        const btnSaveRates = document.getElementById('btn-save-rates');
        const btnResetRates = document.getElementById('btn-reset-rates');

        function formatNumber(num) {
            return num.toFixed(2).replace('.', ',');
        }

        // Rendu du tableau avec le design Elite Slate & Champagne-Gold
        function renderTable() {
            tableBody.innerHTML = "";

            rates.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "luxury-row";
                
                tr.innerHTML = `
                    <!-- UNITÉ -->
                    <td class="py-2.5 px-1 text-center text-[12px] font-bold text-[#c5a880]/60 font-mono-numbers">
                        ${item.unite}
                    </td>
                    <!-- DEVISE + DRAPEAU ÉCUSSON -->
                    <td class="py-2.5 px-2 flex items-center space-x-3">
                        <div class="w-[22px] h-[25px] shield-flag border border-[#c5a880]/10 overflow-hidden shrink-0">
                            ${item.flag}
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[12px] font-semibold text-slate-100 tracking-wide leading-none">${item.name}</span>
                            <span class="text-[9px] font-bold text-slate-500 tracking-wider mt-1 leading-none">${item.id}</span>
                        </div>
                    </td>
                    <!-- ACHAT -->
                    <td class="py-2.5 px-1 text-center text-[13px] font-bold text-rose-300 font-mono-numbers">
                        ${formatNumber(item.buy)}
                    </td>
                    <!-- VENTE -->
                    <td class="py-2.5 px-1 text-center text-[13px] font-bold text-sky-300 font-mono-numbers">
                        ${formatNumber(item.sell)}
                    </td>
                    <!-- Séparateur vert impérial continu -->
                    <td class="emerald-vertical-line p-0 relative">
                        <div class="absolute inset-y-0 left-0 w-full emerald-vertical-line"></div>
                    </td>
                    <!-- REF BKAM -->
                    <td class="py-2.5 px-1 text-center text-[13px] font-bold text-[#4ade80] font-mono-numbers">
                        ${formatNumber(item.bkam)}
                    </td>
                    <!-- TPE -->
                    <td class="py-2.5 px-1 text-center text-[13px] font-bold text-[#fbbf24] font-mono-numbers">
                        ${formatNumber(item.tpe)}
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // Configuration des cours
        btnEditRates.addEventListener('click', () => {
            editHeaderDateInput.value = headerDate.textContent.replace('du ', '').trim();
            editorFormContainer.innerHTML = "";
            rates.forEach(item => {
                const row = document.createElement('div');
                row.className = "bg-[#161a27] p-3 rounded-xl border border-slate-800 space-y-2";
                row.innerHTML = `
                    <div class="flex items-center space-x-2 border-b border-slate-800 pb-1.5 mb-1.5">
                        <div class="w-6 h-6 rounded-full overflow-hidden shrink-0">${item.flag}</div>
                        <span class="font-bold text-xs text-white">${item.name} (${item.id})</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[9px] text-slate-400 mb-0.5">Achat</label>
                            <input type="number" step="0.01" data-id="${item.id}" data-type="buy" value="${item.buy}" class="w-full bg-[#1e2436] border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white text-center font-bold">
                        </div>
                        <div>
                            <label class="block text-[9px] text-slate-400 mb-0.5">Vente</label>
                            <input type="number" step="0.01" data-id="${item.id}" data-type="sell" value="${item.sell}" class="w-full bg-[#1e2436] border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white text-center font-bold">
                        </div>
                        <div>
                            <label class="block text-[9px] text-slate-400 mb-0.5">BKAM</label>
                            <input type="number" step="0.01" data-id="${item.id}" data-type="bkam" value="${item.bkam}" class="w-full bg-[#1e2436] border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white text-center font-bold">
                        </div>
                        <div>
                            <label class="block text-[9px] text-slate-400 mb-0.5">TPE</label>
                            <input type="number" step="0.01" data-id="${item.id}" data-type="tpe" value="${item.tpe}" class="w-full bg-[#1e2436] border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white text-center font-bold">
                        </div>
                    </div>
                `;
                editorFormContainer.appendChild(row);
            });
            editorModal.classList.remove('hidden');
        });

        closeEditorModalBtn.addEventListener('click', () => editorModal.classList.add('hidden'));

        btnSaveRates.addEventListener('click', () => {
            if (editHeaderDateInput.value.trim() !== "") {
                headerDate.textContent = "du " + editHeaderDateInput.value;
            }

            const inputs = editorFormContainer.querySelectorAll('input');
            inputs.forEach(input => {
                const id = input.getAttribute('data-id');
                const type = input.getAttribute('data-type');
                if (id && type) {
                    const val = parseFloat(input.value) || 0;
                    const item = rates.find(r => r.id === id);
                    if (item) {
                        item[type] = val;
                    }
                }
            });
            renderTable();
            editorModal.classList.add('hidden');
        });

        btnResetRates.addEventListener('click', () => {
            rates = JSON.parse(JSON.stringify(initialRatesData));
            headerDate.textContent = "du 19 Mai 2026";
            editorModal.classList.add('hidden');
            renderTable();
        });

        window.addEventListener('click', (e) => {
            if (e.target === editorModal) editorModal.classList.add('hidden');
        });

        window.onload = function() {
            renderTable();
        };
    </script>
</body>
</html>
