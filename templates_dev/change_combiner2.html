<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cours des Billets - TV VIEDER Premium</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts : Syne et Montserrat pour l'en-tête futuriste, JetBrains Mono pour des chiffres parfaitement alignés -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Montserrat:wght@800;900&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #030408;
            overflow: hidden;
        }
        .mono-num {
            font-family: 'JetBrains Mono', monospace;
        }
        .font-syne {
            font-family: 'Syne', sans-serif;
        }
        /* Effet de glow néon vert ultra-premium pour la ligne de division */
        .neon-divider-beam {
            background: linear-gradient(180deg, #10b981 0%, #059669 50%, #10b981 100%) !important;
            box-shadow: 0 0 15px #10b981, 0 0 30px rgba(16, 185, 129, 0.6);
            width: 4px;
            position: relative;
        }
        /* Effet verre dépoli (Glassmorphism) pour les lignes de tableau */
        .glass-row {
            background: rgba(255, 255, 255, 0.015);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .glass-row:nth-child(even) {
            background: rgba(255, 255, 255, 0.04);
        }
        /* Lueur ambiante en arrière-plan */
        .ambient-glow-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .ambient-glow-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-center items-center antialiased p-3 sm:p-6 relative select-none">

    <!-- Lueurs ambiantes décoratives pour la TV -->
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <!-- Container Global TV Premium -->
    <main class="w-full max-w-xl bg-[#090d16]/90 backdrop-blur-xl shadow-[0_0_80px_rgba(0,0,0,0.95)] rounded-2xl overflow-hidden border border-slate-800/60 flex flex-col relative z-10">
        
        <!-- EN-TÊTE : Design Cyber-Lobby TV VIEDER -->
        <header class="relative h-[160px] overflow-hidden flex items-center px-6 bg-gradient-to-b from-[#0b1325] to-[#070c14] border-b border-slate-800">
            
            <!-- Filigrane de lignes géométriques discrètes -->
            <div class="absolute inset-0 pointer-events-none opacity-[0.03] z-0">
                <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1"/>
                        </pattern>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#grid)" />
                </svg>
            </div>

            <!-- Contenu de l'en-tête -->
            <div class="relative w-full z-10 flex items-center justify-between">
                
                <!-- LOGO "TV VIEDER" : Finitions d'acier noir biseauté avec glow cyano-métallique -->
                <!-- C'est aussi le bouton secret pour ouvrir l'éditeur de cours -->
                <div id="btn-edit-rates" title="Ouvrir l'administration" class="cursor-pointer group w-[130px] h-[110px] bg-gradient-to-br from-[#121c30] via-[#090d16] to-[#03060a] border border-slate-700/70 rounded-lg shadow-[0_10px_30px_rgba(0,0,0,0.8),inset_0_2px_4px_rgba(255,255,255,0.05)] flex items-center justify-center p-3 hover:border-sky-500/50 transition-all duration-300">
                    <svg viewBox="0 0 100 80" class="w-full h-full transform group-hover:scale-105 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ffffff"/>
                                <stop offset="30%" stop-color="#e2e8f0"/>
                                <stop offset="50%" stop-color="#94a3b8"/>
                                <stop offset="55%" stop-color="#475569"/>
                                <stop offset="85%" stop-color="#cbd5e1"/>
                                <stop offset="100%" stop-color="#64748b"/>
                            </linearGradient>
                            <filter id="glow">
                                <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.6"/>
                            </filter>
                        </defs>
                        <g filter="url(#glow)">
                            <!-- TV biseauté de gauche -->
                            <text x="2" y="32" font-family="'Montserrat', sans-serif" font-weight="900" font-size="28" fill="url(#chrome-grad)" letter-spacing="-1">T</text>
                            <text x="4" y="65" font-family="'Montserrat', sans-serif" font-weight="900" font-size="28" fill="url(#chrome-grad)" letter-spacing="-1">V</text>
                            
                            <!-- Laser de séparation vertical bleu -->
                            <line x1="28" y1="8" x2="28" y2="72" stroke="#38bdf8" stroke-width="2.5" opacity="0.9" />
                            
                            <!-- VIEDER vertical de droite -->
                            <text x="36" y="16" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" fill="url(#chrome-grad)">V</text>
                            <text x="36" y="27" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" fill="url(#chrome-grad)">I</text>
                            <text x="36" y="38" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" fill="url(#chrome-grad)">E</text>
                            <text x="36" y="49" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" fill="url(#chrome-grad)">D</text>
                            <text x="36" y="60" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" fill="url(#chrome-grad)">E</text>
                            <text x="36" y="71" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" fill="url(#chrome-grad)">R</text>
                        </g>
                    </svg>
                </div>

                <!-- BLOCS DE TEXTES : Typographie futuriste et alignements parfaits -->
                <div class="flex-1 text-center pr-2 flex flex-col justify-center">
                    <h1 class="font-syne text-[24px] font-extrabold tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-slate-400 leading-none">
                        COURS DES BILLETS
                    </h1>
                    <div class="h-[2px] w-1/3 bg-gradient-to-r from-transparent via-slate-500/40 to-transparent mx-auto my-2"></div>
                    <h2 class="text-[14px] font-extrabold tracking-[0.2em] text-[#38bdf8] uppercase leading-none opacity-90">
                        RÉFÉRENCE BKAM
                    </h2>
                    <span id="header-date" class="text-[13px] font-semibold text-slate-400 tracking-wider mt-2.5 block">
                        19/05/2026
                    </span>
                </div>

            </div>
        </header>

        <!-- TABLEAU DES COURS ET DE SES DOUBLE EN-TÊTES DE CATÉGORIES -->
        <section class="flex-grow bg-[#05080f]">
            <table class="w-full text-left border-collapse table-fixed">
                <!-- Définition stricte de la proportion de chaque colonne -->
                <colgroup>
                    <col class="w-[9%]">   <!-- Unité -->
                    <col class="w-[31%]">  <!-- Devises -->
                    <col class="w-[15%]">  <!-- Achat -->
                    <col class="w-[15%]">  <!-- Vente -->
                    <col class="w-[4px]">   <!-- Ligne verte Néon -->
                    <col class="w-[15%]">  <!-- Ref BKAM -->
                    <col class="w-[15%]">  <!-- TPE -->
                </colgroup>

                <!-- Double En-tête -->
                <thead class="sticky top-0 z-20 text-[10px] font-bold uppercase tracking-wider">
                    
                    <!-- LIGNE 1 : Catégories scindées par le rayon laser vertical -->
                    <tr class="bg-[#080e1a]/95 border-b border-slate-900">
                        <!-- Côté Gauche : TAUX DE CHANGE CASH -->
                        <td colspan="4" class="py-3 px-3 text-center">
                            <span class="text-[11px] font-black tracking-[0.15em] text-sky-400 drop-shadow-[0_0_8px_rgba(56,189,248,0.3)]">
                                💵 TAUX DE CHANGE
                            </span>
                        </td>
                        <!-- Jonction du rayon laser vert -->
                        <td class="neon-divider-beam p-0 relative">
                            <div class="absolute inset-0 neon-divider-beam"></div>
                        </td>
                        <!-- Côté Droit : ACHAT PAR CARTE - TPE -->
                        <td colspan="2" class="py-3 px-2 text-center bg-[#071d15]/80">
                            <span class="inline-flex items-center gap-1.5 text-[10px] font-black tracking-[0.15em] text-emerald-400 drop-shadow-[0_0_8px_rgba(16,185,129,0.3)]">
                                💳 ACHAT PAR CARTE - TPE
                            </span>
                        </td>
                    </tr>

                    <!-- LIGNE 2 : Noms de colonnes stylisés -->
                    <tr class="bg-[#03060a] border-b border-slate-800 text-slate-400">
                        <th class="py-3 px-1 text-center font-bold tracking-wider">Unit</th>
                        <th class="py-3 px-2 text-left font-bold tracking-wider">Devises</th>
                        <th class="py-3 px-1 text-center text-rose-400/90 font-extrabold">Achat</th>
                        <th class="py-3 px-1 text-center text-sky-400/90 font-extrabold">Vente</th>
                        <!-- Ligne laser verte vertical -->
                        <th class="neon-divider-beam p-0 relative">
                            <div class="absolute inset-0 neon-divider-beam"></div>
                        </th>
                        <th class="py-3 px-1 text-center text-emerald-400/90 font-extrabold">Ref BKAM</th>
                        <th class="py-3 px-1 text-center text-amber-500/90 font-extrabold">Tpe (-5%)</th>
                    </tr>
                </thead>

                <!-- Corps du tableau -->
                <tbody id="rates-table-body">
                    <!-- Rempli dynamiquement en JS -->
                </tbody>
            </table>
        </section>

        <!-- MODAL D'ADMINISTRATION : Totalement masqué à l'affichage -->
        <div id="editor-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-[#0d1627] border border-slate-700 w-full max-w-sm rounded-2xl p-6 shadow-2xl max-h-[85vh] flex flex-col">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                    <h3 class="font-bold text-sm text-white">Administration des cours</h3>
                    <button id="close-editor-modal" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
                </div>
                
                <div class="space-y-3 mb-4">
                    <label class="block text-xs text-slate-400 font-semibold">Date de Référence :</label>
                    <input type="text" id="edit-header-date" class="w-full bg-[#142037] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-bold focus:border-sky-500 focus:outline-none">
                </div>

                <div id="editor-form-container" class="space-y-4 overflow-y-auto pr-1 flex-grow">
                    <!-- Rempli par JS -->
                </div>

                <div class="border-t border-slate-800 pt-3 mt-4 flex gap-2">
                    <button id="btn-reset-rates" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-bold text-xs transition-colors">Réinitialiser</button>
                    <button id="btn-save-rates" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold text-xs transition-colors">Enregistrer</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Gestionnaires d'événements et de données -->
    <script>
        const initialRatesData = [
            { id: "EUR", unite: 1, name: "Europe", buy: 10.44, sell: 11.08, bkam: 10.71, tpe: 10.18, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#003399"/><g fill="#ffcc00" transform="translate(256,256) scale(26)"><circle r="4" fill="none"/><g id="star"><path d="m0-1.2.3.9h1l-.8.6.3.9-.8-.6-.8.6.3-.9-.8-.6h1z"/></g><use href="#star" y="-7.5"/><use href="#star" y="7.5"/><use href="#star" x="-7.5"/><use href="#star" x="7.5"/><use href="#star" x="-5.3" y="-5.3"/><use href="#star" x="5.3" y="-5.3"/><use href="#star" x="-5.3" y="5.3"/><use href="#star" x="5.3" y="5.3"/><use href="#star" x="-7.2" y="-2.3"/><use href="#star" x="7.2" y="-2.3"/><use href="#star" x="-7.2" y="2.3"/><use href="#star" x="7.2" y="2.3"/></g></svg>` },
            { id: "USD", unite: 1, name: "Etats Unis", buy: 8.98, sell: 9.52, bkam: 9.21, tpe: 8.75, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#bb133e"/><path d="M0,39h512M0,118h512M0,196h512M0,275h512M0,354h512M0,433h512" stroke="#fff" stroke-width="39"/><rect width="205" height="275" fill="#002147"/><g fill="#fff"><g id="us-s5"><g id="us-s4"><g id="us-s3"><g id="us-s2"><g id="us-s1"><circle cx="17" cy="23" r="6"/></g><circle cx="51" cy="23" r="6"/></g><circle cx="85" cy="23" r="6"/></g><circle cx="119" cy="23" r="6"/></g><circle cx="153" cy="23" r="6"/></g><use href="#us-s5" y="46"/><use href="#us-s5" y="92"/><use href="#us-s5" y="138"/><use href="#us-s5" y="184"/><g id="us-s4-row" x="17" y="23"><use href="#us-s4" x="17" y="23"/><use href="#us-s4" x="17" y="69"/><use href="#us-s4" x="17" y="115"/><use href="#us-s4" x="17" y="161"/></g></g></svg>` },
            { id: "CAD", unite: 1, name: "Canada", buy: 6.53, sell: 6.93, bkam: 6.70, tpe: 6.36, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#ff0000"/><rect x="128" width="256" height="512" fill="#ffffff"/><path d="M256,120 L275,180 L335,160 L310,215 L360,240 L300,265 L315,330 L275,300 L256,380 L237,300 L197,330 L212,265 L152,240 L202,215 L177,160 L237,180 Z" fill="#ff0000"/></svg>` },
            { id: "GBP", unite: 1, name: "Angleterre", buy: 12.03, sell: 12.76, bkam: 12.31, tpe: 11.69, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#012169"/><path d="M0 0 L512 512 M0 512 L512 0" stroke="#fff" stroke-width="60"/><path d="M0 0 L512 512 M0 512 L512 0" stroke="#C8102E" stroke-width="40"/><path d="M256 0 V512 M0 256 H512" stroke="#fff" stroke-width="100"/><path d="M256 0 V512 M0 256 H512" stroke="#C8102E" stroke-width="60"/></svg>` },
            { id: "GIP", unite: 1, name: "Gibraltar", buy: 12.03, sell: 12.76, bkam: 12.31, tpe: 11.69, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#ffffff"/><rect y="341" width="512" height="171" fill="#da0012"/><g fill="#da0012" transform="translate(196, 120)"><rect x="30" y="60" width="60" height="120"/><rect x="150" y="20" width="60" height="160"/><rect x="230" y="60" width="60" height="120"/><rect x="30" y="160" width="260" height="20"/></g></svg>` },
            { id: "CHF", unite: 1, name: "Suisse", buy: 11.42, sell: 12.12, bkam: 11.72, tpe: 11.14, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#d52b1e"/><rect x="226" y="106" width="60" height="300" fill="#fff"/><rect x="106" y="226" width="300" height="60" fill="#fff"/></svg>` },
            { id: "SAR", unite: 1, name: "Arabie Saou...", buy: 2.39, sell: 2.54, bkam: 2.45, tpe: 2.33, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#0b6623"/><path d="M100,280 L412,280 M150,300 L362,300 M256,260 L256,320" stroke="#fff" stroke-width="8"/><path d="M150,350 L362,350" stroke="#fff" stroke-width="4"/></svg>` },
            { id: "KWD", unite: 1, name: "Koweit", buy: 29.04, sell: 30.81, bkam: 29.83, tpe: 28.34, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="170.6" fill="#128a41"/><rect y="170.6" width="512" height="170.6" fill="#fff"/><rect y="341.2" width="512" height="170.6" fill="#f31830"/><path d="M0 0 L150 170.6 L0 341.2 Z" fill="#000000"/></svg>` },
            { id: "AED", unite: 1, name: "Emirats Arab...", buy: 2.44, sell: 2.59, bkam: 2.51, tpe: 2.38, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="170.6" fill="#00732f"/><rect y="170.6" width="512" height="170.6" fill="#ffffff"/><rect y="341.2" width="512" height="170.6" fill="#000000"/><rect width="128" height="512" fill="#ff0000"/></svg>` },
            { id: "QAR", unite: 1, name: "Qatar", buy: 2.46, sell: 2.61, bkam: 2.53, tpe: 2.40, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#8a1538"/><path d="M0 0 H140 L190 28.4 L140 56.8 L190 85.2 L140 113.6 L190 142 L140 170.4 L190 198.8 L140 227.2 L190 255.6 L140 284 L190 312.4 L140 340.8 L190 369.2 L140 397.6 L190 426 L140 454.4 L190 482.8 L140 512 H0 Z" fill="#ffffff"/></svg>` },
            { id: "BHD", unite: 1, name: "Bahrein", buy: 23.81, sell: 25.26, bkam: 24.41, tpe: 23.19, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#da121a"/><path d="M0 0 H140 L190 51.2 L140 102.4 L190 153.6 L140 204.8 L190 256 L140 307.2 L190 358.4 L140 409.6 L190 460.8 L140 512 H0 Z" fill="#ffffff"/></svg>` },
            { id: "JPY", unite: 100, name: "Japon", buy: 5.64, sell: 5.99, bkam: 5.80, tpe: 5.51, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#ffffff"/><circle cx="256" cy="256" r="120" fill="#bc002d"/></svg>` }
        ];

        let rates = [...initialRatesData];

        const tableBody = document.getElementById('rates-table-body');
        const editorModal = document.getElementById('editor-modal');
        const headerDate = document.getElementById('header-date');
        const editHeaderDateInput = document.getElementById('edit-header-date');
        
        const btnEditRates = document.getElementById('btn-edit-rates');
        const editorFormContainer = document.getElementById('editor-form-container');
        const closeEditorModalBtn = document.getElementById('close-editor-modal');
        const btnSaveRates = document.getElementById('btn-save-rates');
        const btnResetRates = document.getElementById('btn-reset-rates');

        function formatNumber(num) {
            return num.toFixed(2).replace('.', ',');
        }

        // Rendu du tableau avec le nouveau design Glassmorphism et néons
        function renderTable() {
            tableBody.innerHTML = "";

            rates.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "glass-row border-b border-slate-900 text-slate-300";
                
                tr.innerHTML = `
                    <!-- UNITÉ (Mono) -->
                    <td class="py-3 px-1 text-center text-[12px] font-bold text-slate-500 mono-num select-none">
                        ${item.unite}
                    </td>
                    <!-- DEVISE + DRAPEAU EN MÉDAILLON CIRCULAIRE -->
                    <td class="py-3 px-2 flex items-center space-x-3 select-none">
                        <div class="w-[24px] h-[24px] rounded-full overflow-hidden border border-slate-700/60 shadow-lg shrink-0 scale-105">
                            ${item.flag}
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[12px] font-bold text-white tracking-wide leading-none">${item.name}</span>
                            <span class="text-[9px] font-extrabold text-slate-500 tracking-wider mt-0.5 leading-none">${item.id}</span>
                        </div>
                    </td>
                    <!-- ACHAT (Néon Corail/Rouge) -->
                    <td class="py-3 px-1 text-center text-[14px] font-bold text-[#f87171] drop-shadow-[0_0_8px_rgba(248,113,113,0.15)] mono-num">
                        ${formatNumber(item.buy)}
                    </td>
                    <!-- VENTE (Néon Cyan/Bleu) -->
                    <td class="py-3 px-1 text-center text-[14px] font-bold text-[#38bdf8] drop-shadow-[0_0_8px_rgba(56,189,248,0.15)] mono-num">
                        ${formatNumber(item.sell)}
                    </td>
                    <!-- Séparateur néon vert continu -->
                    <td class="neon-divider-beam p-0 relative">
                        <div class="absolute inset-y-0 left-0 w-full neon-divider-beam"></div>
                    </td>
                    <!-- REF BKAM (Néon Émeraude) -->
                    <td class="py-3 px-1 text-center text-[14px] font-bold text-[#34d399] drop-shadow-[0_0_8px_rgba(52,211,153,0.15)] mono-num">
                        ${formatNumber(item.bkam)}
                    </td>
                    <!-- TPE (Néon Ambre) -->
                    <td class="py-3 px-1 text-center text-[14px] font-bold text-[#fbbf24] drop-shadow-[0_0_8px_rgba(251,191,36,0.15)] mono-num">
                        ${formatNumber(item.tpe)}
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // Configuration / Édition des cours
        btnEditRates.addEventListener('click', () => {
            editHeaderDateInput.value = headerDate.textContent.trim();
            editorFormContainer.innerHTML = "";
            rates.forEach(item => {
                const row = document.createElement('div');
                row.className = "bg-[#111c30] p-3 rounded-xl border border-slate-800 space-y-2";
                row.innerHTML = `
                    <div class="flex items-center space-x-2 border-b border-slate-800 pb-1.5 mb-1.5">
                        <div class="w-6 h-6 rounded-full overflow-hidden shrink-0">${item.flag}</div>
                        <span class="font-bold text-xs text-white">${item.name} (${item.id})</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[9px] text-slate-400 mb-0.5">Achat</label>
                            <input type="number" step="0.01" data-id="${item.id}" data-type="buy" value="${item.buy}" class="w-full bg-[#18263f] border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white text-center font-bold">
                        </div>
                        <div>
                            <label class="block text-[9px] text-slate-400 mb-0.5">Vente</label>
                            <input type="number" step="0.01" data-id="${item.id}" data-type="sell" value="${item.sell}" class="w-full bg-[#18263f] border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white text-center font-bold">
                        </div>
                        <div>
                            <label class="block text-[9px] text-slate-400 mb-0.5">BKAM</label>
                            <input type="number" step="0.01" data-id="${item.id}" data-type="bkam" value="${item.bkam}" class="w-full bg-[#18263f] border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white text-center font-bold">
                        </div>
                        <div>
                            <label class="block text-[9px] text-slate-400 mb-0.5">TPE</label>
                            <input type="number" step="0.01" data-id="${item.id}" data-type="tpe" value="${item.tpe}" class="w-full bg-[#18263f] border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white text-center font-bold">
                        </div>
                    </div>
                `;
                editorFormContainer.appendChild(row);
            });
            editorModal.classList.remove('hidden');
        });

        closeEditorModalBtn.addEventListener('click', () => editorModal.classList.add('hidden'));

        btnSaveRates.addEventListener('click', () => {
            if (editHeaderDateInput.value.trim() !== "") {
                headerDate.textContent = editHeaderDateInput.value;
            }

            const inputs = editorFormContainer.querySelectorAll('input');
            inputs.forEach(input => {
                const id = input.getAttribute('data-id');
                const type = input.getAttribute('data-type');
                if (id && type) {
                    const val = parseFloat(input.value) || 0;
                    const item = rates.find(r => r.id === id);
                    if (item) {
                        item[type] = val;
                    }
                }
            });
            renderTable();
            editorModal.classList.add('hidden');
        });

        btnResetRates.addEventListener('click', () => {
            rates = JSON.parse(JSON.stringify(initialRatesData));
            headerDate.textContent = "19/05/2026";
            editorModal.classList.add('hidden');
            renderTable();
        });

        window.addEventListener('click', (e) => {
            if (e.target === editorModal) editorModal.classList.add('hidden');
        });

        window.onload = function() {
            renderTable();
        };
    </script>
</body>
</html>
