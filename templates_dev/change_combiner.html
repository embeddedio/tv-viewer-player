<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cours des Billets - TV VIEDER</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts : Montserrat pour le rendu lourd et carré de l'en-tête, Inter pour les chiffres -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #05080f;
        }
        .font-header {
            font-family: 'Montserrat', sans-serif;
        }
        /* Style spécial pour la ligne verte de séparation pour garantir sa visibilité sur grand écran */
        .green-divider {
            background-color: #10b981 !important;
            box-shadow: 0 0 6px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-center items-center antialiased p-2 sm:p-4">

    <!-- Container Global - Format Écran TV Vertical ou Horizontal de Bureau de Change -->
    <main class="w-full max-w-lg bg-[#070c14] shadow-[0_0_50px_rgba(0,0,0,0.85)] rounded-lg overflow-hidden border border-slate-800/80 flex flex-col relative">
        
        <!-- EN-TÊTE TV : Réplique 100% exacte de l'image -->
        <header class="relative h-[155px] overflow-hidden flex items-center px-4 bg-[#0a0f1d] border-b border-slate-900">
            
            <!-- Arrière-plan de billets en filigrane (Reproduction de la photo de fond) -->
            <div class="absolute inset-0 pointer-events-none z-0">
                <svg width="100%" height="100%" viewBox="0 0 500 155" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Gradients pour les rouleaux de billets -->
                        <linearGradient id="pink-bill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#3d1d2b"/>
                            <stop offset="30%" stop-color="#c66a85"/>
                            <stop offset="60%" stop-color="#e28ca5"/>
                            <stop offset="100%" stop-color="#3d1d2b"/>
                        </linearGradient>
                        <linearGradient id="blue-bill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#142c44"/>
                            <stop offset="40%" stop-color="#5a8dbd"/>
                            <stop offset="70%" stop-color="#80b3e6"/>
                            <stop offset="100%" stop-color="#142c44"/>
                        </linearGradient>
                        <linearGradient id="green-bill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#1a3525"/>
                            <stop offset="35%" stop-color="#55966e"/>
                            <stop offset="65%" stop-color="#7fc299"/>
                            <stop offset="100%" stop-color="#1a3525"/>
                        </linearGradient>
                        <linearGradient id="purple-yellow-bill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#2a1b3d"/>
                            <stop offset="40%" stop-color="#7d5fa7"/>
                            <stop offset="75%" stop-color="#cca8e9"/>
                            <stop offset="100%" stop-color="#2a1b3d"/>
                        </linearGradient>
                    </defs>

                    <!-- Les rouleaux de billets inclinés comme sur la photo de fond -->
                    <g transform="rotate(-15 250 77) translate(-20, -30)">
                        <!-- Rouleau Rose (Peso) -->
                        <rect x="20" y="-50" width="75" height="300" fill="url(#pink-bill)" rx="6" opacity="0.6"/>
                        <!-- Filigranes sur rouleau rose -->
                        <path d="M 25,0 L 90,50 M 25,100 L 90,150" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
                        <circle cx="55" cy="80" r="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1"/>

                        <!-- Rouleau Bleu (Euro/50000) -->
                        <rect x="105" y="-50" width="75" height="300" fill="url(#blue-bill)" rx="6" opacity="0.75"/>
                        <path d="M 110,30 L 175,80 M 110,130 L 175,180" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
                        <circle cx="140" cy="110" r="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1"/>

                        <!-- Rouleau Vert (Dollar) -->
                        <rect x="190" y="-50" width="75" height="300" fill="url(#green-bill)" rx="6" opacity="0.65"/>
                        <path d="M 195,10 L 260,60 M 195,110 L 260,160" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
                        <circle cx="225" cy="80" r="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1"/>

                        <!-- Rouleau Violet/Jaune -->
                        <rect x="275" y="-50" width="75" height="300" fill="url(#purple-yellow-bill)" rx="6" opacity="0.55"/>
                        <path d="M 280,40 L 345,90 M 280,140 L 345,190" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
                        
                        <!-- Rouleau Vert 2 -->
                        <rect x="360" y="-50" width="75" height="300" fill="url(#green-bill)" rx="6" opacity="0.5"/>
                    </g>
                </svg>
            </div>
            
            <!-- Assombrissement progressif pour détacher le texte blanc et le logo de l'image -->
            <div class="absolute inset-0 bg-black/60 z-10"></div>

            <!-- Contenu Réel de l'en-tête (Logo à gauche, Textes centrés à droite) -->
            <div class="relative w-full z-20 flex items-center justify-between">
                
                <!-- LOGO "TV VIEDER" : Bouton secret pour ouvrir l'administration des cours -->
                <div id="btn-edit-rates" title="Administration des cours" class="cursor-pointer w-[125px] h-[105px] bg-gradient-to-b from-[#181818] to-[#0c0c0c] border border-neutral-700/80 rounded shadow-[inset_0_2px_4px_rgba(255,255,255,0.1),0_10px_20px_rgba(0,0,0,0.8)] flex items-center justify-center p-2.5 hover:brightness-125 transition-all">
                    <svg viewBox="0 0 100 80" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Effet chrome pour les lettres -->
                            <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#ffffff"/>
                                <stop offset="40%" stop-color="#dddddd"/>
                                <stop offset="50%" stop-color="#888888"/>
                                <stop offset="55%" stop-color="#555555"/>
                                <stop offset="85%" stop-color="#b8b8b8"/>
                                <stop offset="100%" stop-color="#777777"/>
                            </linearGradient>
                            <!-- Ombre portée pour donner du relief 3D -->
                            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                                <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#000000" flood-opacity="0.9"/>
                            </filter>
                        </defs>
                        <g filter="url(#shadow)">
                            <!-- Lettre T & V stylisées à gauche -->
                            <text x="3" y="32" font-family="'Montserrat', sans-serif" font-weight="900" font-size="28" fill="url(#chrome-grad)" letter-spacing="-1">T</text>
                            <text x="5" y="65" font-family="'Montserrat', sans-serif" font-weight="900" font-size="28" fill="url(#chrome-grad)" letter-spacing="-1">V</text>
                            
                            <!-- Séparateur biseauté -->
                            <line x1="28" y1="8" x2="28" y2="72" stroke="url(#chrome-grad)" stroke-width="2.5" />
                            
                            <!-- VIEDER verticalement étiré à droite -->
                            <text x="36" y="16" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" fill="url(#chrome-grad)" letter-spacing="1">V</text>
                            <text x="36" y="27" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" fill="url(#chrome-grad)" letter-spacing="1">I</text>
                            <text x="36" y="38" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" fill="url(#chrome-grad)" letter-spacing="1">E</text>
                            <text x="36" y="49" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" fill="url(#chrome-grad)" letter-spacing="1">D</text>
                            <text x="36" y="60" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" fill="url(#chrome-grad)" letter-spacing="1">E</text>
                            <text x="36" y="71" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" fill="url(#chrome-grad)" letter-spacing="1">R</text>
                        </g>
                    </svg>
                </div>

                <!-- BLOCS DE TEXTES : Centrés exactement comme sur la photo -->
                <div class="flex-1 text-center pr-1 flex flex-col justify-center select-none">
                    <h1 class="font-header text-[22px] font-black tracking-tight text-white leading-tight drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">
                        COURS DES BILLETS +
                    </h1>
                    <h2 class="font-header text-[21px] font-black text-white leading-tight drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] mt-0.5">
                        REF BKAM
                    </h2>
                    <span id="header-date" class="font-header text-[17px] font-bold text-slate-300 tracking-wider mt-1.5 block drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">
                        19/05/2026
                    </span>
                </div>

            </div>
        </header>

        <!-- TABLEAU DES COURS AVEC DOUBLE EN-TÊTE ET DIVISION VERTE CONTINUE -->
        <section class="flex-grow overflow-hidden bg-white">
            <table class="w-full text-left border-collapse table-fixed">
                <!-- Définition stricte de la proportion de chaque colonne pour un alignement optimal -->
                <colgroup>
                    <col class="w-[10%]">  <!-- Unité -->
                    <col class="w-[30%]">  <!-- Devises -->
                    <col class="w-[15%]">  <!-- Achat -->
                    <col class="w-[15%]">  <!-- Vente -->
                    <col class="w-[4px]">   <!-- Ligne verte -->
                    <col class="w-[15%]">  <!-- Ref BKAM -->
                    <col class="w-[15%]">  <!-- TPE -->
                </colgroup>

                <!-- Double En-tête : Les catégories puis les colonnes -->
                <thead class="sticky top-0 z-20 text-[10px] font-bold text-slate-300 uppercase tracking-wider">
                    
                    <!-- LIGNE 1 : Catégories divisées par la ligne verte -->
                    <tr class="bg-[#121d30] border-b border-slate-900">
                        <!-- Côté Gauche : TAUX DE CHANGE -->
                        <td colspan="4" class="py-2.5 px-3 text-center">
                            <span class="text-[11px] font-black tracking-widest text-[#84a9ff]">
                                TAUX DE CHANGE
                            </span>
                        </td>
                        <!-- Jonction de la ligne verte verticale -->
                        <td class="green-divider p-0 relative">
                            <div class="absolute inset-0 green-divider"></div>
                        </td>
                        <!-- Côté Droit : ACHAT PAR CARTE - TPE -->
                        <td colspan="2" class="py-2.5 px-2 text-center bg-[#092c1d]">
                            <span class="inline-flex items-center gap-1.5 text-[10px] font-black tracking-widest text-[#3be099]">
                                ACHAT PAR CARTE - TPE
                            </span>
                        </td>
                    </tr>

                    <!-- LIGNE 2 : Noms des colonnes -->
                    <tr class="bg-[#090f1a] border-b border-slate-300">
                        <th class="py-3 px-1 text-center text-slate-400 font-semibold">Unite</th>
                        <th class="py-3 px-2 text-left text-slate-400 font-semibold">Devises</th>
                        <th class="py-3 px-1 text-center text-rose-400 font-bold">Achat</th>
                        <th class="py-3 px-1 text-center text-blue-400 font-bold">Vente</th>
                        <!-- Ligne verte verticale -->
                        <th class="green-divider p-0 relative">
                            <div class="absolute inset-0 green-divider"></div>
                        </th>
                        <th class="py-3 px-1 text-center text-emerald-400 font-bold">Ref BKAM</th>
                        <th class="py-3 px-1 text-center text-amber-500 font-bold">Tpe (-5%)</th>
                    </tr>
                </thead>

                <!-- Corps du tableau : Généré de manière stable et ordonnée -->
                <tbody id="rates-table-body">
                    <!-- Généré dynamiquement en JS pour conserver la modifiabilité -->
                </tbody>
            </table>
        </section>

        <!-- MODAL ADMINISTRATEUR : Modifier les taux -->
        <div id="editor-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-[#0d1627] border border-slate-700 w-full max-w-sm rounded-xl p-5 shadow-2xl max-h-[85vh] flex flex-col">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                    <h3 class="font-bold text-sm text-white">Administration des cours</h3>
                    <button id="close-editor-modal" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
                </div>
                
                <div class="space-y-3 mb-4">
                    <label class="block text-xs text-slate-400 font-semibold">Date de Référence des cours :</label>
                    <input type="text" id="edit-header-date" class="w-full bg-[#142037] border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white font-bold">
                </div>

                <div id="editor-form-container" class="space-y-4 overflow-y-auto pr-1 flex-grow">
                    <!-- Rempli par JS -->
                </div>

                <div class="border-t border-slate-800 pt-3 mt-4 flex gap-2">
                    <button id="btn-reset-rates" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-bold text-xs transition-colors">Réinitialiser</button>
                    <button id="btn-save-rates" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold text-xs transition-colors">Enregistrer</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Script Javascript de gestion des données -->
    <script>
        // Table de données originale, identique à l'image
        const initialRatesData = [
            { id: "EUR", unite: 1, name: "Europe", buy: 10.44, sell: 11.08, bkam: 10.71, tpe: 10.18, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#003399"/><g fill="#ffcc00" transform="translate(256,256) scale(26)"><circle r="4" fill="none"/><g id="star"><path d="m0-1.2.3.9h1l-.8.6.3.9-.8-.6-.8.6.3-.9-.8-.6h1z"/></g><use href="#star" y="-7.5"/><use href="#star" y="7.5"/><use href="#star" x="-7.5"/><use href="#star" x="7.5"/><use href="#star" x="-5.3" y="-5.3"/><use href="#star" x="5.3" y="-5.3"/><use href="#star" x="-5.3" y="5.3"/><use href="#star" x="5.3" y="5.3"/><use href="#star" x="-7.2" y="-2.3"/><use href="#star" x="7.2" y="-2.3"/><use href="#star" x="-7.2" y="2.3"/><use href="#star" x="7.2" y="2.3"/></g></svg>` },
            { id: "USD", unite: 1, name: "Etats Unis", buy: 8.98, sell: 9.52, bkam: 9.21, tpe: 8.75, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#bb133e"/><path d="M0,39h512M0,118h512M0,196h512M0,275h512M0,354h512M0,433h512" stroke="#fff" stroke-width="39"/><rect width="205" height="275" fill="#002147"/><g fill="#fff"><g id="us-s5"><g id="us-s4"><g id="us-s3"><g id="us-s2"><g id="us-s1"><circle cx="17" cy="23" r="6"/></g><circle cx="51" cy="23" r="6"/></g><circle cx="85" cy="23" r="6"/></g><circle cx="119" cy="23" r="6"/></g><circle cx="153" cy="23" r="6"/></g><use href="#us-s5" y="46"/><use href="#us-s5" y="92"/><use href="#us-s5" y="138"/><use href="#us-s5" y="184"/><g id="us-s4-row" x="17" y="23"><use href="#us-s4" x="17" y="23"/><use href="#us-s4" x="17" y="69"/><use href="#us-s4" x="17" y="115"/><use href="#us-s4" x="17" y="161"/></g></g></svg>` },
            { id: "CAD", unite: 1, name: "Canada", buy: 6.53, sell: 6.93, bkam: 6.70, tpe: 6.36, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#ff0000"/><rect x="128" width="256" height="512" fill="#ffffff"/><path d="M256,120 L275,180 L335,160 L310,215 L360,240 L300,265 L315,330 L275,300 L256,380 L237,300 L197,330 L212,265 L152,240 L202,215 L177,160 L237,180 Z" fill="#ff0000"/></svg>` },
            { id: "GBP", unite: 1, name: "Angleterre", buy: 12.03, sell: 12.76, bkam: 12.31, tpe: 11.69, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#012169"/><path d="M0 0 L512 512 M0 512 L512 0" stroke="#fff" stroke-width="60"/><path d="M0 0 L512 512 M0 512 L512 0" stroke="#C8102E" stroke-width="40"/><path d="M256 0 V512 M0 256 H512" stroke="#fff" stroke-width="100"/><path d="M256 0 V512 M0 256 H512" stroke="#C8102E" stroke-width="60"/></svg>` },
            { id: "GIP", unite: 1, name: "Gibraltar", buy: 12.03, sell: 12.76, bkam: 12.31, tpe: 11.69, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#ffffff"/><rect y="341" width="512" height="171" fill="#da0012"/><g fill="#da0012" transform="translate(196, 120)"><rect x="30" y="60" width="60" height="120"/><rect x="150" y="20" width="60" height="160"/><rect x="230" y="60" width="60" height="120"/><rect x="30" y="160" width="260" height="20"/></g></svg>` },
            { id: "CHF", unite: 1, name: "Suisse", buy: 11.42, sell: 12.12, bkam: 11.72, tpe: 11.14, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#d52b1e"/><rect x="226" y="106" width="60" height="300" fill="#fff"/><rect x="106" y="226" width="300" height="60" fill="#fff"/></svg>` },
            { id: "SAR", unite: 1, name: "Arabie Saou...", buy: 2.39, sell: 2.54, bkam: 2.45, tpe: 2.33, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#0b6623"/><path d="M100,280 L412,280 M150,300 L362,300 M256,260 L256,320" stroke="#fff" stroke-width="8"/><path d="M150,350 L362,350" stroke="#fff" stroke-width="4"/></svg>` },
            { id: "KWD", unite: 1, name: "Koweit", buy: 29.04, sell: 30.81, bkam: 29.83, tpe: 28.34, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="170.6" fill="#128a41"/><rect y="170.6" width="512" height="170.6" fill="#fff"/><rect y="341.2" width="512" height="170.6" fill="#f31830"/><path d="M0 0 L150 170.6 L0 341.2 Z" fill="#000000"/></svg>` },
            { id: "AED", unite: 1, name: "Emirats Arab...", buy: 2.44, sell: 2.59, bkam: 2.51, tpe: 2.38, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="170.6" fill="#00732f"/><rect y="170.6" width="512" height="170.6" fill="#ffffff"/><rect y="341.2" width="512" height="170.6" fill="#000000"/><rect width="128" height="512" fill="#ff0000"/></svg>` },
            { id: "QAR", unite: 1, name: "Qatar", buy: 2.46, sell: 2.61, bkam: 2.53, tpe: 2.40, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#8a1538"/><path d="M0 0 H140 L190 28.4 L140 56.8 L190 85.2 L140 113.6 L190 142 L140 170.4 L190 198.8 L140 227.2 L190 255.6 L140 284 L190 312.4 L140 340.8 L190 369.2 L140 397.6 L190 426 L140 454.4 L190 482.8 L140 512 H0 Z" fill="#ffffff"/></svg>` },
            { id: "BHD", unite: 1, name: "Bahrein", buy: 23.81, sell: 25.26, bkam: 24.41, tpe: 23.19, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#da121a"/><path d="M0 0 H140 L190 51.2 L140 102.4 L190 153.6 L140 204.8 L190 256 L140 307.2 L190 358.4 L140 409.6 L190 460.8 L140 512 H0 Z" fill="#ffffff"/></svg>` },
            { id: "JPY", unite: 100, name: "Japon", buy: 5.64, sell: 5.99, bkam: 5.80, tpe: 5.51, flag: `<svg viewBox="0 0 512 512" class="w-full h-full"><rect width="512" height="512" fill="#ffffff"/><circle cx="256" cy="256" r="120" fill="#bc002d"/></svg>` }
        ];

        let rates = [...initialRatesData];

        // Éléments du DOM
        const tableBody = document.getElementById('rates-table-body');
        const editorModal = document.getElementById('editor-modal');
        const headerDate = document.getElementById('header-date');
        const editHeaderDateInput = document.getElementById('edit-header-date');
        
        // Modal Éditeur Éléments (Le bouton d'activation est désormais le logo de l'en-tête)
        const btnEditRates = document.getElementById('btn-edit-rates');
        const editorFormContainer = document.getElementById('editor-form-container');
        const closeEditorModalBtn = document.getElementById('close-editor-modal');
        const btnSaveRates = document.getElementById('btn-save-rates');
        const btnResetRates = document.getElementById('btn-reset-rates');

        // Formatage français (virgule décimale)
        function formatNumber(num) {
            return num.toFixed(2).replace('.', ',');
        }

        // Rendu stable de la table complète (Focus double en-tête avec ligne verte continue)
        function renderTable() {
            tableBody.innerHTML = "";

            rates.forEach((item, index) => {
                const tr = document.createElement('tr');
                
                // Zébrure parfaite du tableau
                tr.className = `border-b border-slate-200/60 ${index % 2 === 0 ? 'bg-white' : 'bg-[#f4f7fa]'} text-[#142642] transition-colors duration-100`;
                
                tr.innerHTML = `
                    <!-- UNITÉ -->
                    <td class="py-2.5 px-1 text-center text-[13px] font-black text-slate-500">
                        ${item.unite}
                    </td>
                    <!-- DEVISE + DRAPEAU -->
                    <td class="py-2.5 px-2 flex items-center space-x-2">
                        <div class="w-[26px] h-[18px] rounded-sm overflow-hidden border border-slate-300 shadow-sm shrink-0">
                            ${item.flag}
                        </div>
                        <span class="text-[12px] font-bold text-[#142642] truncate max-w-[100px]">${item.name}</span>
                    </td>
                    <!-- ACHAT -->
                    <td class="py-2.5 px-1 text-center text-[13px] font-bold text-[#db3a34]">
                        ${formatNumber(item.buy)}
                    </td>
                    <!-- VENTE -->
                    <td class="py-2.5 px-1 text-center text-[13px] font-bold text-[#1e53a3]">
                        ${formatNumber(item.sell)}
                    </td>
                    <!-- Ligne verte de séparation parfaite qui se prolonge -->
                    <td class="green-divider p-0 relative">
                        <div class="absolute inset-y-0 left-0 w-full green-divider"></div>
                    </td>
                    <!-- REF BKAM -->
                    <td class="py-2.5 px-1 text-center text-[13px] font-bold text-[#20a065]">
                        ${formatNumber(item.bkam)}
                    </td>
                    <!-- TPE -->
                    <td class="py-2.5 px-1 text-center text-[13px] font-bold text-[#ca7519]">
                        ${formatNumber(item.tpe)}
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // Administration / Configuration des cours
        btnEditRates.addEventListener('click', () => {
            // Remplir la date de référence actuelle
            editHeaderDateInput.value = headerDate.textContent.trim();
            
            // Remplir le formulaire
            editorFormContainer.innerHTML = "";
            rates.forEach(item => {
                const row = document.createElement('div');
                row.className = "bg-[#101b30] p-3 rounded-lg border border-slate-800 space-y-2";
                row.innerHTML = `
                    <div class="flex items-center space-x-2 border-b border-slate-800 pb-1.5 mb-1.5">
                        <div class="w-6 h-4 rounded overflow-hidden">${item.flag}</div>
                        <span class="font-bold text-xs text-white">${item.name} (${item.id})</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-0.5">Achat</label>
                            <input type="number" step="0.01" data-id="${item.id}" data-type="buy" value="${item.buy}" class="w-full bg-[#18263f] border border-slate-700 rounded px-2 py-1 text-xs text-white text-center font-bold">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-0.5">Vente</label>
                            <input type="number" step="0.01" data-id="${item.id}" data-type="sell" value="${item.sell}" class="w-full bg-[#18263f] border border-slate-700 rounded px-2 py-1 text-xs text-white text-center font-bold">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-0.5">BKAM</label>
                            <input type="number" step="0.01" data-id="${item.id}" data-type="bkam" value="${item.bkam}" class="w-full bg-[#18263f] border border-slate-700 rounded px-2 py-1 text-xs text-white text-center font-bold">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-0.5">TPE</label>
                            <input type="number" step="0.01" data-id="${item.id}" data-type="tpe" value="${item.tpe}" class="w-full bg-[#18263f] border border-slate-700 rounded px-2 py-1 text-xs text-white text-center font-bold">
                        </div>
                    </div>
                `;
                editorFormContainer.appendChild(row);
            });
            editorModal.classList.remove('hidden');
        });

        closeEditorModalBtn.addEventListener('click', () => editorModal.classList.add('hidden'));

        // Enregistrer les modifications de taux et de date de mise à jour
        btnSaveRates.addEventListener('click', () => {
            // Mettre à jour la date de référence
            if (editHeaderDateInput.value.trim() !== "") {
                headerDate.textContent = editHeaderDateInput.value;
            }

            // Mettre à jour les taux
            const inputs = editorFormContainer.querySelectorAll('input');
            inputs.forEach(input => {
                const id = input.getAttribute('data-id');
                const type = input.getAttribute('data-type');
                if (id && type) {
                    const val = parseFloat(input.value) || 0;
                    const item = rates.find(r => r.id === id);
                    if (item) {
                        item[type] = val;
                    }
                }
            });
            renderTable();
            editorModal.classList.add('hidden');
        });

        // Remettre les taux originaux d'origine (image)
        btnResetRates.addEventListener('click', () => {
            rates = JSON.parse(JSON.stringify(initialRatesData));
            headerDate.textContent = "19/05/2026";
            editorModal.classList.add('hidden');
            renderTable();
        });

        // Fermeture automatique au clic à l'extérieur
        window.addEventListener('click', (e) => {
            if (e.target === editorModal) editorModal.classList.add('hidden');
        });

        // Lancement initial de la configuration TV
        window.onload = function() {
            renderTable();
        };
    </script>
</body>
</html>
