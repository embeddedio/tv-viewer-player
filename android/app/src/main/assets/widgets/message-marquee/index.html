<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#0f172a;overflow:hidden;
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif}

#root{width:100%;height:100%;display:flex;align-items:center;overflow:hidden}

.track{
  display:flex;align-items:center;white-space:nowrap;
  animation:marq-ltr linear infinite;
  will-change:transform;
}
.track[data-dir="rtl"]{animation-name:marq-rtl}

@keyframes marq-ltr{
  from{transform:translateX(0)}
  to  {transform:translateX(-50%)}
}
@keyframes marq-rtl{
  from{transform:translateX(-50%)}
  to  {transform:translateX(0)}
}

.msg{display:inline-block;color:#ffffff;font-weight:700;padding:0 6px}
.sep{display:inline-block;color:#facc15;font-weight:700;padding:0 10px}
.placeholder{width:100%;text-align:center;color:#94a3b8;font-size:18px}
</style>
</head>
<body>
<div id="root"><div class="placeholder">Aucun message configuré</div></div>
<script>
(function(){
  const p = new URLSearchParams(location.search);
  const fontSize  = Math.max(10, parseFloat(p.get('fontSize') || '28'));
  const speed     = Math.min(5, Math.max(0.05, parseFloat(p.get('speed') || '1')));
  const direction = (p.get('direction') === 'rtl') ? 'rtl' : 'ltr';
  const REFRESH   = 60 * 1000;
  let messages = [];

  function render(msgs) {
    messages = msgs;
    const root = document.getElementById('root');

    if (!msgs.length) {
      root.innerHTML = '<div class="placeholder">Aucun message configuré</div>';
      return;
    }

    const segment = msgs.map(function(msg) {
      return '<span class="msg" style="font-size:' + fontSize + 'px">' + escHtml(msg) + '</span>' +
             '<span class="sep" style="font-size:' + fontSize + 'px"> ★ </span>';
    }).join('');

    const track = document.createElement('div');
    track.className = 'track';
    track.dataset.dir = direction;
    track.innerHTML = segment + segment;
    root.innerHTML = '';
    root.appendChild(track);

    requestAnimationFrame(function() {
      const halfW = track.scrollWidth / 2;
      const baseDur = Math.max(10000, msgs.length * 5000);
      track.style.animationDuration = Math.round(baseDur / speed) + 'ms';
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function load() {
    fetch('/api/widgets/message-marquee')
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data.messages && data.messages.length) render(data.messages);
        else if (!messages.length) render([]);
      })
      .catch(function(){
        if (!messages.length) render([]);
      });
  }

  load();
  setInterval(load, REFRESH);
})();
</script>
</body>
</html>
