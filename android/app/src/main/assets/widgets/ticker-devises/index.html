<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#152238;overflow:hidden;
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}

#root{width:100%;height:100%;display:flex;align-items:center;overflow:hidden;position:relative}

.loader{width:100%;text-align:center;color:#5e6f84;font-size:14px;letter-spacing:.04em}

.track{
  display:flex;align-items:center;white-space:nowrap;
  animation:ticker-ltr linear infinite;
  will-change:transform;
}

@keyframes ticker-ltr{
  from{transform:translateX(0)}
  to  {transform:translateX(-50%)}
}

.item{
  display:inline-flex;align-items:center;
  padding:0 clamp(8px,1.5vh,22px);
}

.flag{
  height:clamp(22px,5.5vh,56px);
  width:calc(clamp(22px,5.5vh,56px)*1.35);
  object-fit:cover;border-radius:3px;flex-shrink:0;
  display:block;
}
.flag-fb{
  height:clamp(22px,5.5vh,56px);
  width:calc(clamp(22px,5.5vh,56px)*1.35);
  background:#1a2d4a;border-radius:3px;
  display:none;align-items:center;justify-content:center;
  font-size:clamp(7px,1.6vh,16px);font-weight:700;color:#fff;flex-shrink:0;
}

.lbl{
  display:flex;flex-direction:column;justify-content:center;
  margin-left:clamp(4px,0.6vh,10px);
}
.code{
  font-size:clamp(10px,2.8vh,30px);font-weight:800;
  color:#fff;letter-spacing:.5px;line-height:1.1;
}
.name{
  font-size:clamp(7px,1.5vh,15px);font-weight:500;
  color:#5e6f84;margin-top:1px;
}

.prices{
  display:flex;flex-direction:column;justify-content:center;
  margin-left:clamp(6px,0.8vh,14px);
}
.pr{display:flex;align-items:baseline;line-height:1.25}
.cap{font-size:clamp(6px,1.3vh,13px);font-weight:600;color:#5e6f84;margin-right:2px}
.buy {font-size:clamp(9px,2.6vh,28px);font-weight:800;color:#c0392b;font-variant-numeric:tabular-nums}
.sell{font-size:clamp(9px,2.6vh,28px);font-weight:800;color:#095fcf;font-variant-numeric:tabular-nums}

.sep{
  display:inline-block;width:1px;
  height:clamp(16px,5.5vh,56px);
  background:#dde4f0;opacity:.3;
  margin:0 clamp(3px,0.4vh,7px);
  vertical-align:middle;flex-shrink:0;
}
</style>
</head>
<body>
<div id="root"><div class="loader">Chargement…</div></div>
<script>
(function(){
  const p = new URLSearchParams(location.search);
  const speed = Math.min(5, Math.max(0.05, parseFloat(p.get('speed') || p.get('fontScale') || '1')));
  const REFRESH = 30 * 60 * 1000;
  let rates = [];

  function shortLabel(label) {
    const sep = label.indexOf(' : ');
    const base = sep === -1 ? label : label.slice(sep + 3);
    const dash = base.lastIndexOf(' - ');
    return dash === -1 ? base : base.slice(0, dash);
  }

  function buildItem(rate) {
    const code = rate.code.split('-')[0].toUpperCase();
    const flagSrc = '/widgets/tableau-change/assets/' + code + '.jpg';
    return '<div class="item">' +
      '<img class="flag" src="' + flagSrc + '" alt="' + code + '"' +
        ' onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
      '<div class="flag-fb">' + code + '</div>' +
      '<div class="lbl">' +
        '<span class="code">' + code + '</span>' +
        '<span class="name">' + shortLabel(rate.label) + '</span>' +
      '</div>' +
      '<div class="prices">' +
        '<div class="pr"><span class="cap">ACH&nbsp;</span><span class="buy">' + (rate.buy || '—') + '</span></div>' +
        '<div class="pr"><span class="cap">VTE&nbsp;</span><span class="sell">' + (rate.sell || '—') + '</span></div>' +
      '</div>' +
    '</div>' +
    '<span class="sep"></span>';
  }

  function render(newRates) {
    rates = newRates;
    const root = document.getElementById('root');
    const track = document.createElement('div');
    track.className = 'track';
    const html = rates.map(buildItem).join('');
    track.innerHTML = html + html;
    root.innerHTML = '';
    root.appendChild(track);

    requestAnimationFrame(function() {
      const halfW = track.scrollWidth / 2;
      const baseDur = Math.max(15000, halfW * 22);
      track.style.animationDuration = Math.round(baseDur / speed) + 'ms';
    });
  }

  function load() {
    fetch('/api/widgets/ticker-devises')
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data.rates && data.rates.length) render(data.rates);
      })
      .catch(function(){
        if (!rates.length)
          document.getElementById('root').innerHTML = '<div class="loader">Données non disponibles</div>';
      });
  }

  load();
  setInterval(load, REFRESH);
})();
</script>
</body>
</html>
